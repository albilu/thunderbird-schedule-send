name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/check.yml
    with:
      release-tag: ${{ github.ref_name }}

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - name: Verify package and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          package="thunderbird-scheduled-send-${PACKAGE_VERSION}.xpi"
          sha256sum --check "$package.sha256"
          gh release create "$RELEASE_TAG" "$package" "$package.sha256" \
            --verify-tag \
            --title "Scheduled Send $RELEASE_TAG" \
            --generate-notes
