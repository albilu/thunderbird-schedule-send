<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="queueTitle">Scheduled messages</title><link rel="stylesheet" href="../styles/common.css"><link rel="stylesheet" href="queue.css"></head>
<body>
  <main>
    <header class="page-header"><div><p class="eyebrow" data-i18n="extensionName"></p><h1 data-i18n="queueTitle"></h1><p class="hint" data-i18n="queueSubtitle"></p></div><button id="refresh" class="subtle" data-i18n="refresh"></button></header>
    <div class="status-line"><span id="connection" role="status"></span><span id="timezone" class="hint"></span></div>
    <div class="queue-tools"><div class="segments" role="group" data-i18n-title="queueFilter"><button id="active" class="segment selected" aria-pressed="true" data-i18n="activeSchedules"></button><button id="history" class="segment" aria-pressed="false" data-i18n="history"></button></div><label class="search"><span class="sr-only" data-i18n="searchSchedules"></span><input id="search" type="search"></label></div>
    <p id="error" class="error" role="alert"></p>
    <p id="feedback" role="status" class="hint"></p>
    <section id="jobs" aria-live="polite" aria-busy="true"></section>
    <footer class="page-footer"><p data-i18n="deliveryNote"></p><p data-i18n="snapshotNote"></p></footer>
  </main>
  <dialog id="confirmation" aria-labelledby="confirmation-title"><h2 id="confirmation-title"></h2><p id="confirmation-text"></p><form method="dialog" class="actions"><button value="cancel" data-i18n="keepMessage"></button><button id="confirm-action" value="confirm" class="primary"></button></form></dialog>
  <dialog id="edit-dialog" aria-labelledby="edit-title"><h2 id="edit-title" data-i18n="reschedule"></h2><form id="edit-form"><div id="edit-rule"></div><p id="edit-error" class="error" role="alert"></p><div class="actions"><button id="close-edit" type="button" data-i18n="close"></button><button id="save-edit" class="primary" type="submit" data-i18n="saveSchedule"></button></div></form></dialog>
  <script type="module" src="queue.mjs"></script>
</body></html>
